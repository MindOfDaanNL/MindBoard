<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="MindBoard — projectbeheer met organisaties, rollen en kanban-borden" />
  <title>MindBoard · Projectbeheer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <div id="app">
    <!-- Auth view -->
    <div id="view-auth" class="auth-wrap hidden">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="logo-badge logo-badge-lg">
            <svg class="ic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16" cy="8" r="3.2"/><circle cx="12" cy="16" r="3.2"/><path d="M8 8l8 0M8 8l4 8M16 8l-4 8"/></svg>
          </span>
          <h1>Mind<span>Board</span></h1>
          <p>Projectbeheer · rollen · kanban</p>
        </div>
        <div class="auth-tabs">
          <button data-tab="login" class="auth-tab active">Inloggen</button>
          <button data-tab="register" class="auth-tab">Account maken</button>
        </div>
        <form id="form-login" class="auth-form">
          <label>E-mail of gebruikersnaam</label>
          <input id="li-email" type="text" autocomplete="username" required />
          <label>Wachtwoord</label>
          <input id="li-password" type="password" autocomplete="current-password" required />
          <button type="submit" class="btn-primary btn-block">Inloggen</button>
          <p class="form-error" id="li-error"></p>
        </form>
        <form id="form-register" class="auth-form hidden">
          <label>E-mailadres</label>
          <input id="rg-email" type="email" autocomplete="email" required />
          <label>Gebruikersnaam</label>
          <input id="rg-username" type="text" autocomplete="username" minlength="3" maxlength="32" required />
          <label>Volledige naam (optioneel)</label>
          <input id="rg-fullname" type="text" />
          <label>Wachtwoord (min. 8 tekens)</label>
          <input id="rg-password" type="password" autocomplete="new-password" minlength="8" required />
          <button type="submit" class="btn-primary btn-block">Account aanmaken</button>
          <p class="form-error" id="rg-error"></p>
        </form>
      </div>
    </div>

    <!-- App shell -->
    <div id="view-app" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar" class="icon-btn" title="Menu"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
          <a href="#/dashboard" class="brand">
            <span class="logo-badge">
              <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5l4.5-1.5 4.5 1.5v6.5c0 4-2.6 7-9 10-6.4-3-9-6-9-10V3.5l4.5-1.5 4.5 1.5z" opacity=".0"/><circle cx="8" cy="8" r="3.2"/><circle cx="8" cy="8" r="3.2" transform="translate(8,0)"/><circle cx="8" cy="8" r="3.2" transform="translate(4,7)"/><path d="M8 8l8 0M8 8l-4 7M8 8l4 0M8 8l4 0" opacity="0"/></svg>
            </span>
            <h1>Mind<span>Board</span></h1>
          </a>
        </div>
<div class="topbar-center">
          <div class="search-box">
            <svg class="ic search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="search-input" type="search" placeholder="Zoek taken, projecten…" autocomplete="off" />
            <div id="search-results" class="search-results hidden"></div>
          </div>
        </div>
        <div class="topbar-right">
          <button id="btn-theme" class="icon-btn" title="Donker/licht thema"></button>
          <button id="btn-notifications" class="icon-btn" title="Notificaties">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="notif-badge" class="badge hidden"></span>
          </button>
          <div class="user-menu">
            <button id="btn-user" class="avatar-btn" title="Account"></button>
            <div id="user-dropdown" class="dropdown hidden">
              <div class="dropdown-user" id="dropdown-user"></div>
              <button data-nav="#/settings" class="dropdown-item">
                <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Instellingen
              </button>
              <button id="btn-logout" class="dropdown-item danger">
                <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                Uitloggen
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="notif-panel" class="notif-panel hidden">
        <div class="notif-header">
          <strong>Notificaties</strong>
          <button id="btn-read-all" class="btn-ghost btn-sm">Alles gelezen</button>
        </div>
        <div id="notif-list"></div>
      </div>

      <nav id="sidebar" class="sidebar hidden">
        <div class="sidebar-section">
          <button data-nav="#/dashboard" class="nav-item active">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 12c0 0 3.5-7 9-7s9 7 9 7-3.5 7-9 7-9-7-9-7z"/></svg>
            <span>Dashboard</span>
          </button>
          <button data-nav="#/orgs" class="nav-item">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
            <span>Organisaties</span>
          </button>
          <button data-nav="#/projects" class="nav-item">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Projecten</span>
          </button>
          <button data-nav="#/admin" class="nav-item admin-only hidden">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/></svg>
            <span>Beheer</span>
          </button>
        </div>
        <div class="sidebar-orgs" id="sidebar-orgs"></div>
        <div class="sidebar-footer">
          <button id="btn-new-org" class="btn-primary btn-block btn-sm">
            <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Nieuwe organisatie
          </button>
        </div>
      </nav>

      <main id="main" class="main"></main>
    </div>

    <!-- Modals -->
    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>
  <script src="/app.js?v=4"></script>
  <script>
    window.addEventListener('error', function (e) {
      var main = document.getElementById('main');
      if (main && !main.innerHTML.trim()) {
        main.innerHTML = '<div class="empty-state"><div class="big">⚠️</div><p>Er ging iets mis bij het laden: <code>' + (e.message || 'onbekende fout') + '</code></p><br><button class="btn-primary" onclick="location.reload()">Opnieuw laden</button></div>';
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(function () {
          return navigator.serviceWorker.ready;
        })
        .then(function (reg) {
          reg.update();
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
          }
          return reg;
        })
        .then(function (reg) {
          // Oude SW-caches definitief opruimen en één keer automatisch herladen
          if (window.caches) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) {
                if (k.indexOf('mindboard') === 0) return caches.delete(k);
              }));
            }).then(function () {
              try {
                if (sessionStorage.getItem('mb_reset') !== '1') {
                  sessionStorage.setItem('mb_reset', '1');
                  window.location.reload();
                }
              } catch (e) {}
            });
          }
        })
        .catch(function () {});
    }
  </script>
</body>
</html>
